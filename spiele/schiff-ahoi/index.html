<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schiff Ahoi</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b3d5c; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
</head>
<body>
<canvas id="spiel"></canvas>
<script>
// ===== Schiff Ahoi! =====
// Steuere dein Schiff mit den Pfeiltasten (oder WASD) oder tippe/klicke dorthin, wo es hinfahren soll.
// Das Meer ist unendlich groß! Sammle Schätze ein, schieß auf Haie und pass auf deine Leben auf!

const canvas = document.getElementById("spiel");
const ctx = canvas.getContext("2d");

function groesseAnpassen() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", groesseAnpassen);
groesseAnpassen();

// ----- Einstellungen (hier kannst du rumprobieren!) -----
const SCHIFF_TEMPO = 4;      // wie schnell das Schiff fährt
const ANZAHL_SCHAETZE = 1;   // wie viele Schätze gleichzeitig in deiner Nähe sind
const LEBEN = 3;
const MAX_LEBEN = 5;         // mehr Leben kann man nicht haben
const LEBEN_PRO_SCHATZ = 1;  // so viele Leben bekommst du für jeden Schatz
const UNENDLICH_MUNITION = true; // true = unendlich viele Kanonenkugeln, false = nur so viele wie bei KANONEN_SCHUSS
const KANONEN_SCHUSS = 3;    // wie viele Kanonenkugeln du hast (nur wenn UNENDLICH_MUNITION = false)
const KUGEL_TEMPO = 9;       // wie schnell die Kanonenkugeln fliegen
const BOSS_ALLE_PUNKTE = 50; // alle so viele Punkte kommt ein Boss-Hai
const BOSS_LEBEN = 10;       // so viele Treffer braucht der erste Boss-Hai (jeder weitere hält mehr aus!)
const INSEL_CHANCE = 0.6;    // wie viele Inseln es gibt (0 = keine, 1 = ganz viele)

// So funktioniert das unendliche Meer:
// Das Meer ist in große Felder (Kacheln) aufgeteilt. Immer wenn das Schiff
// in die Nähe einer neuen Kachel kommt, wird sie erfunden – mit Inseln drauf.
// Schätze und Haie, die zu weit weg sind, tauchen wieder in deiner Nähe auf.
const KACHEL = 500;

// ----- Spielzustand -----
let zustand = "start"; // "start", "spielen", "ende"
let boss, naechsterBoss, bossNummer, meldung;
let schiff, schaetze, haie, punkte, leben, unverwundbar, funken, schuss, kugeln, weltNummer, kacheln;
let highscore = Number(ladeHighscore());

function ladeHighscore() {
  try { return localStorage.getItem("schiffAhoiHighscore") || 0; } catch (e) { return 0; }
}
function speichereHighscore(wert) {
  try { localStorage.setItem("schiffAhoiHighscore", wert); } catch (e) {}
}

function zufall(min, max) { return min + Math.random() * (max - min); }
function abstand(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// Ein "Würfel", der für dieselbe Kachel immer dieselben Zahlen würfelt.
// So bleibt eine Insel an ihrem Platz, auch wenn du wegfährst und wiederkommst.
function kachelWuerfel(kx, ky) {
  let s = (kx * 374761393 + ky * 668265263 + weltNummer * 982451653) | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function inselnDerKachel(kx, ky) {
  const name = kx + "," + ky;
  if (!kacheln.has(name)) {
    const wuerfel = kachelWuerfel(kx, ky);
    const liste = [];
    if (wuerfel() < INSEL_CHANCE) {
      const r = 50 + wuerfel() * 50;
      const insel = {
        x: kx * KACHEL + r + 20 + wuerfel() * (KACHEL - 2 * r - 40),
        y: ky * KACHEL + r + 20 + wuerfel() * (KACHEL - 2 * r - 40),
        r: r,
      };
      // Keine Insel genau dort, wo das Schiff losfährt
      if (Math.hypot(insel.x, insel.y) > insel.r + 120) liste.push(insel);
    }
    kacheln.set(name, liste);
  }
  return kacheln.get(name);
}

// Alle Inseln rund um einen Punkt
function inselnBei(x, y) {
  const kx = Math.floor(x / KACHEL), ky = Math.floor(y / KACHEL);
  const ergebnis = [];
  for (let a = -1; a <= 1; a++) {
    for (let b = -1; b <= 1; b++) ergebnis.push(...inselnDerKachel(kx + a, ky + b));
  }
  return ergebnis;
}

function aufInsel(x, y, extra) {
  return inselnBei(x, y).some(i => Math.hypot(x - i.x, y - i.y) < i.r + extra);
}

function neuesSpiel() {
  weltNummer = Math.floor(Math.random() * 100000); // jedes Spiel ein neues Meer
  kacheln = new Map();
  schiff = { x: 0, y: 0, winkel: 0 };
  schaetze = [];
  for (let i = 0; i < ANZAHL_SCHAETZE; i++) schaetze.push(neuerSchatz());
  haie = [neuerHai()];
  punkte = 0;
  leben = LEBEN;
  unverwundbar = 0;
  funken = [];
  schuss = KANONEN_SCHUSS;
  kugeln = [];
  boss = null;
  naechsterBoss = BOSS_ALLE_PUNKTE;
  bossNummer = 0;
  meldung = null;
  zustand = "spielen";
}

// Sucht einen freien Platz im Meer rund ums Schiff (nicht zu nah, nicht zu weit)
function platzInDerNaehe(minWeg, maxWeg) {
  for (let versuch = 0; versuch < 100; versuch++) {
    const w = zufall(0, Math.PI * 2);
    const weg = zufall(minWeg, maxWeg);
    const x = schiff.x + Math.cos(w) * weg;
    const y = schiff.y + Math.sin(w) * weg;
    if (!aufInsel(x, y, 30)) return { x, y };
  }
  return { x: schiff.x + maxWeg, y: schiff.y };
}

function neuerSchatz() {
  const p = platzInDerNaehe(200, 700);
  // Manche Schätze sind mehr wert!
  const arten = [
    { emoji: "🪙", wert: 1 },
    { emoji: "🪙", wert: 1 },
    { emoji: "💎", wert: 3 },
    { emoji: "👑", wert: 5 },
  ];
  const art = arten[Math.floor(Math.random() * arten.length)];
  return { x: p.x, y: p.y, emoji: art.emoji, wert: art.wert, zeit: Math.random() * 10 };
}

function neuerHai() {
  const p = platzInDerNaehe(450, 800);
  const hai = { x: p.x, y: p.y, vx: 0, vy: 0, tempo: zufall(1.2, 2.2), denken: 0 };
  haiDreht(hai);
  return hai;
}

// Der Hai sucht sich eine neue Richtung – oft schwimmt er ungefähr auf dein Schiff zu!
function haiDreht(h) {
  let w = Math.atan2(schiff.y - h.y, schiff.x - h.x);
  w += zufall(-1.2, 1.2);
  if (Math.random() < 0.3) w = zufall(0, Math.PI * 2);
  h.vx = Math.cos(w) * h.tempo;
  h.vy = Math.sin(w) * h.tempo;
  h.denken = zufall(2, 4); // Sekunden bis zur nächsten Drehung
}

// ----- Steuerung -----
const tasten = {};
window.addEventListener("keydown", e => {
  tasten[e.key.toLowerCase()] = true;
  if ((e.key === " " || e.key === "Enter") && zustand !== "spielen") neuesSpiel();
  else if (e.key === " " && zustand === "spielen" && !e.repeat) schiessen();
  if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
});
window.addEventListener("keyup", e => { tasten[e.key.toLowerCase()] = false; });

let ziel = null; // wohin man getippt hat (auf dem Bildschirm)
canvas.addEventListener("pointerdown", e => {
  if (zustand !== "spielen") { neuesSpiel(); return; }
  // Auf den Kanonen-Knopf getippt?
  const k = kanonenKnopf();
  if (Math.hypot(e.clientX - k.x, e.clientY - k.y) < k.r) { schiessen(); return; }
  ziel = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointermove", e => { if (ziel) ziel = { x: e.clientX, y: e.clientY }; });
window.addEventListener("pointerup", () => { ziel = null; });

// ----- Kanonen -----
// Der Knopf unten rechts zum Schießen (für Handy und Tablet)
function kanonenKnopf() {
  return { x: canvas.width - 60, y: canvas.height - 60, r: 45 };
}

function schiessen() {
  if (!UNENDLICH_MUNITION) {
    if (schuss <= 0) { ton(200, 0.1, "square"); return; } // Klick – leer!
    schuss--;
  }
  // Die Kugel fliegt in die Richtung, in die das Schiff schaut
  const vx = Math.cos(schiff.winkel), vy = Math.sin(schiff.winkel);
  kugeln.push({ x: schiff.x + vx * 32, y: schiff.y + vy * 32, vx: vx * KUGEL_TEMPO, vy: vy * KUGEL_TEMPO, weg: 0 });
  // Rauchwolke an der Kanone
  for (let k = 0; k < 10; k++) {
    funken.push({ x: schiff.x + vx * 32, y: schiff.y + vy * 32, vx: vx * zufall(0, 2) + zufall(-1, 1), vy: vy * zufall(0, 2) + zufall(-1, 1), leben: 1, farbe: "200,200,200", groesse: 7 });
  }
  ton(90, 0.35, "sawtooth");
}

// ----- Spiel-Logik -----
function aktualisieren(dt) {
  if (zustand !== "spielen") return;

  if (unverwundbar > 0) unverwundbar -= dt;

  // Schiff bewegen
  let dx = 0, dy = 0;
  if (tasten["arrowleft"] || tasten["a"]) dx -= 1;
  if (tasten["arrowright"] || tasten["d"]) dx += 1;
  if (tasten["arrowup"] || tasten["w"]) dy -= 1;
  if (tasten["arrowdown"] || tasten["s"]) dy += 1;
  if (ziel) {
    // Das Schiff ist immer in der Mitte des Bildschirms
    const zx = ziel.x - canvas.width / 2, zy = ziel.y - canvas.height / 2;
    if (Math.hypot(zx, zy) > 10) { dx = zx; dy = zy; }
  }
  const laenge = Math.hypot(dx, dy);
  if (laenge > 0) {
    const neuX = schiff.x + dx / laenge * SCHIFF_TEMPO;
    const neuY = schiff.y + dy / laenge * SCHIFF_TEMPO;
    // Nicht auf Inseln fahren
    if (!aufInsel(neuX, neuY, 15)) { schiff.x = neuX; schiff.y = neuY; }
    // Schiff dreht sich sanft in Fahrtrichtung
    const zielWinkel = Math.atan2(dy, dx);
    let diff = zielWinkel - schiff.winkel;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    schiff.winkel += diff * 0.2;
    // Kleine Wellen hinter dem Schiff
    if (Math.random() < 0.5) {
      funken.push({ x: schiff.x - Math.cos(schiff.winkel) * 25, y: schiff.y - Math.sin(schiff.winkel) * 25, leben: 1, farbe: "255,255,255", groesse: 4 });
    }
  }

  // Schätze einsammeln
  for (let i = 0; i < schaetze.length; i++) {
    const s = schaetze[i];
    s.zeit += dt;
    if (abstand(schiff, s) < 35) {
      punkte += s.wert;
      // Jeder Schatz schenkt dir ein Leben!
      leben = Math.min(leben + LEBEN_PRO_SCHATZ, MAX_LEBEN);
      for (let k = 0; k < 8; k++) {
        funken.push({ x: schiff.x, y: schiff.y, vx: zufall(-2, 2), vy: zufall(-3, -1), leben: 1, farbe: "255,80,140", groesse: 5 });
      }
      for (let k = 0; k < 15; k++) {
        funken.push({ x: s.x, y: s.y, vx: zufall(-3, 3), vy: zufall(-3, 3), leben: 1, farbe: "255,215,0", groesse: 5 });
      }
      if (s.beute) { schaetze.splice(i, 1); i--; } // Boss-Beute verschwindet einfach
      else schaetze[i] = neuerSchatz();
      ton(800, 0.1); setTimeout(() => ton(1200, 0.15), 90);
    } else if (abstand(schiff, s) > 1200 && !s.beute) {
      // Zu weit weg? Dann versteckt sich ein neuer Schatz in deiner Nähe
      schaetze[i] = neuerSchatz();
    }
  }

  // Alle 10 Punkte kommt ein Hai dazu – es wird schwerer!
  while (haie.length < 1 + Math.floor(punkte / 10)) haie.push(neuerHai());

  // Haie schwimmen herum
  for (const h of haie) {
    h.denken -= dt;
    if (h.denken <= 0) haiDreht(h);
    h.x += h.vx; h.y += h.vy;
    if (aufInsel(h.x, h.y, 10)) { h.x -= h.vx * 2; h.y -= h.vy * 2; h.vx *= -1; h.vy *= -1; }
    // Zu weit weggeschwommen? Dann taucht der Hai woanders in deiner Nähe auf
    if (abstand(schiff, h) > 1300) Object.assign(h, neuerHai());
    if (unverwundbar <= 0 && abstand(schiff, h) < 32) {
      autsch();
      if (leben <= 0) return;
    }
  }

  // ----- Der Boss-Hai -----
  if (!boss && punkte >= naechsterBoss) bossKommt();
  if (boss) {
    // Der Boss schwimmt direkt auf dich zu und wackelt dabei hin und her
    const zx = schiff.x - boss.x, zy = schiff.y - boss.y;
    const weg = Math.hypot(zx, zy) || 1;
    const wackel = Math.sin(uhr * 3) * 0.6;
    let bx = (zx / weg) * boss.tempo + (-zy / weg) * wackel;
    let by = (zy / weg) * boss.tempo + (zx / weg) * wackel;
    if (aufInsel(boss.x + bx, boss.y + by, 30)) {
      // Insel im Weg? Dann schwimmt er seitlich drumherum
      const seitX = -by, seitY = bx;
      bx = seitX; by = seitY;
    }
    boss.x += bx; boss.y += by;
    boss.vx = bx;
    if (boss.blinken > 0) boss.blinken -= dt;
    // Abgehängt? Der Boss findet dich trotzdem!
    if (weg > 1300) { const p = platzInDerNaehe(600, 800); boss.x = p.x; boss.y = p.y; }
    if (unverwundbar <= 0 && weg < 55) {
      autsch();
      if (leben <= 0) return;
    }
  }
  if (meldung) { meldung.zeit -= dt; if (meldung.zeit <= 0) meldung = null; }

  // Kanonenkugeln fliegen
  for (const kugel of kugeln) {
    kugel.x += kugel.vx; kugel.y += kugel.vy;
    kugel.weg += KUGEL_TEMPO;
    // Trifft die Kugel einen Hai?
    for (const h of haie) {
      if (!h.getroffen && abstand(kugel, h) < 30) {
        h.getroffen = true;
        kugel.weg = 9999;
        punkte += 2; // Bonus für den Treffer!
        for (let k = 0; k < 20; k++) {
          funken.push({ x: h.x, y: h.y, vx: zufall(-4, 4), vy: zufall(-4, 4), leben: 1, farbe: "255,120,0", groesse: 6 });
        }
        ton(120, 0.4, "square");
      }
    }
    // Trifft die Kugel den Boss-Hai?
    if (boss && kugel.weg < 9999 && abstand(kugel, boss) < 55) {
      kugel.weg = 9999;
      bossGetroffen();
    }
    // Auf eine Insel geprallt?
    if (aufInsel(kugel.x, kugel.y, 0)) kugel.weg = 9999;
  }
  // Kugeln, die zu weit geflogen sind oder getroffen haben, verschwinden
  kugeln = kugeln.filter(k => k.weg < 600);
  haie = haie.filter(h => !h.getroffen);

  // Funken und Wellen
  for (const f of funken) {
    f.x += f.vx || 0; f.y += f.vy || 0;
    f.leben -= dt * 1.5;
  }
  funken = funken.filter(f => f.leben > 0);
}

// Das Schiff wurde gebissen!
function autsch() {
  leben--;
  unverwundbar = 2;
  ton(150, 0.3, "sawtooth");
  if (leben <= 0) spielEnde();
}

function bossKommt() {
  bossNummer++;
  const p = platzInDerNaehe(550, 750);
  const maxLeben = BOSS_LEBEN + (bossNummer - 1) * 5; // jeder Boss hält 5 Treffer mehr aus
  boss = { x: p.x, y: p.y, vx: 0, leben: maxLeben, maxLeben: maxLeben, tempo: Math.min(1.5 + bossNummer * 0.2, 3.2), blinken: 0 };
  meldung = { text: "⚠️ BOSS-HAI KOMMT! ⚠️", zeit: 3 };
  ton(110, 0.5, "sawtooth"); setTimeout(() => ton(90, 0.6, "sawtooth"), 400);
}

function bossGetroffen() {
  boss.leben--;
  boss.blinken = 0.15;
  ton(250, 0.1, "square");
  for (let k = 0; k < 6; k++) {
    funken.push({ x: boss.x, y: boss.y, vx: zufall(-3, 3), vy: zufall(-3, 3), leben: 1, farbe: "255,80,80", groesse: 5 });
  }
  if (boss.leben <= 0) {
    // BESIEGT! Riesige Explosion und ganz viel Beute
    punkte += 15;
    for (let k = 0; k < 60; k++) {
      funken.push({ x: boss.x, y: boss.y, vx: zufall(-7, 7), vy: zufall(-7, 7), leben: 1.5, farbe: k % 2 ? "255,120,0" : "255,215,0", groesse: 9 });
    }
    for (let k = 0; k < 4; k++) {
      const w = (k / 4) * Math.PI * 2;
      schaetze.push({ x: boss.x + Math.cos(w) * 60, y: boss.y + Math.sin(w) * 60, emoji: "👑", wert: 5, zeit: Math.random() * 10, beute: true });
    }
    meldung = { text: "🎉 BOSS BESIEGT! +15 🎉", zeit: 3 };
    naechsterBoss = punkte + BOSS_ALLE_PUNKTE;
    boss = null;
    ton(300, 0.15); setTimeout(() => ton(450, 0.15), 150); setTimeout(() => ton(600, 0.15), 300); setTimeout(() => ton(900, 0.4), 450);
  }
}

function spielEnde() {
  zustand = "ende";
  if (punkte > highscore) { highscore = punkte; speichereHighscore(punkte); }
  ton(400, 0.2); setTimeout(() => ton(300, 0.3), 200);
}

// ----- Kleiner Sound mit Web Audio -----
let audio = null;
function ton(frequenz, dauer, art = "sine") {
  try {
    if (!audio) audio = new AudioContext();
    const osz = audio.createOscillator();
    const laut = audio.createGain();
    osz.type = art;
    osz.frequency.value = frequenz;
    laut.gain.setValueAtTime(0.15, audio.currentTime);
    laut.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dauer);
    osz.connect(laut).connect(audio.destination);
    osz.start();
    osz.stop(audio.currentTime + dauer);
  } catch (e) {}
}

// ----- Zeichnen -----
let uhr = 0;
// Die Kamera schaut immer auf das Schiff
let kamera = { x: 0, y: 0 };

function zeichneMeer() {
  const verlauf = ctx.createLinearGradient(0, 0, 0, canvas.height);
  verlauf.addColorStop(0, "#1a8fc4");
  verlauf.addColorStop(1, "#0b4f7a");
  ctx.fillStyle = verlauf;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Wellen – sie bewegen sich mit der Kamera mit, damit man sieht, dass das Schiff fährt
  const links = kamera.x - canvas.width / 2, oben = kamera.y - canvas.height / 2;
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 2;
  for (let y = Math.floor(oben / 50) * 50; y < oben + canvas.height + 50; y += 50) {
    ctx.beginPath();
    for (let x = Math.floor(links / 10) * 10; x <= links + canvas.width + 10; x += 10) {
      const wy = y + Math.sin(x / 40 + uhr * 2 + y) * 5;
      const sx = x - links, sy = wy - oben;
      if (x === Math.floor(links / 10) * 10) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
}

function zeichneInsel(i) {
  // Sand
  ctx.fillStyle = "#f2d38b";
  ctx.beginPath(); ctx.arc(i.x, i.y, i.r, 0, Math.PI * 2); ctx.fill();
  // Gras
  ctx.fillStyle = "#4caf50";
  ctx.beginPath(); ctx.arc(i.x, i.y, i.r * 0.65, 0, Math.PI * 2); ctx.fill();
  // Palme
  ctx.font = `${i.r * 0.8}px serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🌴", i.x, i.y);
}

function sichtbareInseln() {
  const liste = [];
  const k1x = Math.floor((kamera.x - canvas.width / 2) / KACHEL), k2x = Math.floor((kamera.x + canvas.width / 2) / KACHEL);
  const k1y = Math.floor((kamera.y - canvas.height / 2) / KACHEL), k2y = Math.floor((kamera.y + canvas.height / 2) / KACHEL);
  for (let kx = k1x; kx <= k2x; kx++) {
    for (let ky = k1y; ky <= k2y; ky++) liste.push(...inselnDerKachel(kx, ky));
  }
  return liste;
}

function zeichneSchiff() {
  // Blinkt, wenn es gerade getroffen wurde
  if (unverwundbar > 0 && Math.floor(uhr * 10) % 2 === 0) return;
  ctx.save();
  ctx.translate(schiff.x, schiff.y + Math.sin(uhr * 3) * 2);
  ctx.rotate(schiff.winkel);
  // Rumpf
  ctx.fillStyle = "#8b4513";
  ctx.beginPath();
  ctx.moveTo(30, 0);
  ctx.lineTo(10, -14);
  ctx.lineTo(-25, -12);
  ctx.lineTo(-25, 12);
  ctx.lineTo(10, 14);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#5a2d0c"; ctx.lineWidth = 3; ctx.stroke();
  // Deck
  ctx.fillStyle = "#c68642";
  ctx.fillRect(-18, -7, 30, 14);
  // Mast und Segel
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(-2, -22); ctx.quadraticCurveTo(8, 0, -2, 22); ctx.lineTo(-6, 22); ctx.lineTo(-6, -22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5a2d0c";
  ctx.beginPath(); ctx.arc(-4, 0, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Flagge oben drauf
  ctx.font = "16px serif";
  ctx.textAlign = "center";
  ctx.fillText("🏴‍☠️", schiff.x, schiff.y - 30);
}

function zeichneSchatz(s) {
  const huepf = Math.sin(s.zeit * 4) * 4;
  // Glitzer-Kreis
  ctx.fillStyle = `rgba(255,230,100,${0.25 + Math.sin(s.zeit * 6) * 0.15})`;
  ctx.beginPath(); ctx.arc(s.x, s.y, 24, 0, Math.PI * 2); ctx.fill();
  ctx.font = "28px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(s.emoji, s.x, s.y + huepf);
}

// Kleine gelbe Pfeile am Rand zeigen, wo Schätze sind, die man noch nicht sieht
function zeichneSchatzPfeile() {
  const mx = canvas.width / 2, my = canvas.height / 2;
  for (const s of schaetze) {
    const sx = s.x - kamera.x + mx, sy = s.y - kamera.y + my;
    if (sx > 0 && sx < canvas.width && sy > 60 && sy < canvas.height) continue; // schon sichtbar
    const w = Math.atan2(sy - my, sx - mx);
    // Pfeil an den Bildschirmrand setzen
    const rand = 30;
    const fx = Math.cos(w), fy = Math.sin(w);
    const tx = fx !== 0 ? (mx - rand) / Math.abs(fx) : Infinity;
    const ty = fy !== 0 ? (my - rand - 30) / Math.abs(fy) : Infinity;
    const t = Math.min(tx, ty);
    ctx.save();
    ctx.translate(mx + fx * t, my + 15 + fy * t);
    ctx.rotate(w);
    ctx.fillStyle = "rgba(255,215,0,0.85)";
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function zeichneHai(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  if (h.vx < 0) ctx.scale(-1, 1);
  ctx.font = "34px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.scale(-1, 1); // Emoji-Hai schaut nach links, wir drehen ihn
  ctx.fillText("🦈", 0, 0);
  ctx.restore();
}

function zeichneBoss() {
  ctx.save();
  ctx.translate(boss.x, boss.y + Math.sin(uhr * 4) * 3);
  // Roter Schein, wenn er getroffen wird
  if (boss.blinken > 0) {
    ctx.fillStyle = "rgba(255,0,0,0.5)";
    ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  if (boss.vx > 0) ctx.scale(-1, 1); // in Schwimmrichtung schauen
  ctx.font = "100px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🦈", 0, 0);
  ctx.restore();
  // Krone auf dem Kopf
  ctx.font = "34px serif";
  ctx.textAlign = "center";
  ctx.fillText("👑", 0, -55);
  // Lebensbalken
  const breite = 100;
  ctx.fillStyle = "#400";
  ctx.fillRect(-breite / 2, -82, breite, 10);
  ctx.fillStyle = "#e33";
  ctx.fillRect(-breite / 2, -82, breite * (boss.leben / boss.maxLeben), 10);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.strokeRect(-breite / 2, -82, breite, 10);
  ctx.restore();
}

// Roter Pfeil zum Boss, wenn er nicht zu sehen ist
function zeichneBossPfeil() {
  const mx = canvas.width / 2, my = canvas.height / 2;
  const sx = boss.x - kamera.x + mx, sy = boss.y - kamera.y + my;
  if (sx > -40 && sx < canvas.width + 40 && sy > 20 && sy < canvas.height + 40) return;
  const w = Math.atan2(sy - my, sx - mx);
  const fx = Math.cos(w), fy = Math.sin(w);
  const t = Math.min(fx !== 0 ? (mx - 40) / Math.abs(fx) : Infinity, fy !== 0 ? (my - 70) / Math.abs(fy) : Infinity);
  ctx.save();
  ctx.translate(mx + fx * t, my + 15 + fy * t);
  ctx.font = "30px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🦈", 0, 0);
  ctx.rotate(w);
  ctx.fillStyle = "rgba(230,30,30,0.9)";
  ctx.beginPath(); ctx.moveTo(38, 0); ctx.lineTo(20, -12); ctx.lineTo(20, 12); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function zeichneAnzeige() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, canvas.width, 55);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px system-ui";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillText(`💰 ${punkte}`, 20, 28);
  // Wie viele Schuss noch übrig sind
  ctx.textAlign = "center";
  const munition = UNENDLICH_MUNITION ? "💣 ∞" : "💣".repeat(schuss) + "⚪".repeat(KANONEN_SCHUSS - schuss);
  ctx.fillText(munition, canvas.width / 2, 28);
  ctx.textAlign = "right";
  ctx.fillText("❤️".repeat(leben), canvas.width - 20, 28);
}

function zeichneKanonenKnopf() {
  const k = kanonenKnopf();
  ctx.fillStyle = (UNENDLICH_MUNITION || schuss > 0) ? "rgba(200,40,40,0.75)" : "rgba(80,80,80,0.6)";
  ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
  ctx.font = "34px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("💣", k.x, k.y - 4);
  ctx.font = "bold 14px system-ui";
  ctx.fillStyle = "#fff";
  ctx.fillText(UNENDLICH_MUNITION ? "∞" : `${schuss}`, k.x, k.y + 26);
}

function zeichneText(zeilen) {
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  zeilen.forEach((z, n) => {
    ctx.font = n === 0 ? "bold 56px system-ui" : "24px system-ui";
    ctx.fillText(z, canvas.width / 2, canvas.height / 2 - 80 + n * 50 + (n > 0 ? 20 : 0));
  });
}

function zeichnen() {
  if (zustand !== "start") kamera = { x: schiff.x, y: schiff.y };
  zeichneMeer();
  if (zustand === "start") {
    zeichneText([
      "⛵ Schiff Ahoi! ⛵",
      "Fahr übers unendliche Meer und finde Schätze: 🪙 = 1   💎 = 3   👑 = 5",
      "Pass auf die Haie auf! 🦈  Schieß mit deinen Kanonen 💣",
      `Alle ${BOSS_ALLE_PUNKTE} Punkte kommt ein BOSS-HAI! 🦈👑`,
      "Steuern: Pfeiltasten / WASD oder tippen – Schießen: Leertaste",
      "Jeder Schatz schenkt dir ein Leben ❤️",
      "Leertaste oder Klick zum Starten",
      `🏆 Rekord: ${highscore}`,
    ]);
    return;
  }

  // Alles in der Welt wird relativ zur Kamera gezeichnet
  ctx.save();
  ctx.translate(canvas.width / 2 - kamera.x, canvas.height / 2 - kamera.y);
  sichtbareInseln().forEach(zeichneInsel);
  for (const f of funken) {
    ctx.fillStyle = `rgba(${f.farbe},${f.leben * 0.7})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.groesse * f.leben + 1, 0, Math.PI * 2); ctx.fill();
  }
  schaetze.forEach(zeichneSchatz);
  haie.forEach(zeichneHai);
  if (boss) zeichneBoss();
  zeichneSchiff();
  for (const kugel of kugeln) {
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(kugel.x, kugel.y, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Anzeigen bleiben fest auf dem Bildschirm
  zeichneSchatzPfeile();
  if (boss) zeichneBossPfeil();
  zeichneAnzeige();
  if (meldung) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, meldung.zeit);
    ctx.font = "bold 40px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 6; ctx.strokeStyle = "#000";
    ctx.strokeText(meldung.text, canvas.width / 2, 110);
    ctx.fillStyle = "#ffd166";
    ctx.fillText(meldung.text, canvas.width / 2, 110);
    ctx.restore();
  }
  zeichneKanonenKnopf();
  if (zustand === "ende") {
    zeichneText([
      "🦈 Oh nein! 🦈",
      `Du hast ${punkte} Schatz-Punkte gefunden!`,
      punkte >= highscore && punkte > 0 ? "🎉 Neuer Rekord! 🎉" : `🏆 Rekord: ${highscore}`,
      "Leertaste oder Klick für eine neue Runde",
    ]);
  }
}

// ----- Spiel-Schleife -----
let letzteZeit = performance.now();
function schleife(jetzt) {
  const dt = Math.min((jetzt - letzteZeit) / 1000, 0.05);
  letzteZeit = jetzt;
  uhr += dt;
  aktualisieren(dt);
  zeichnen();
  requestAnimationFrame(schleife);
}
requestAnimationFrame(schleife);
</script>
